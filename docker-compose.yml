services:
  keeper:
    image: clickhouse/clickhouse-keeper:24.8
    container_name: keeper
    volumes:
      - ./config/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml

  ch1:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch1
    depends_on: [keeper]
    environment: &chenv
      CLICKHOUSE_USER: admin
      CLICKHOUSE_PASSWORD: admin123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ch1_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  ch2:
    image: clickhouse/clickhouse-server:24.8
    container_name: ch2
    depends_on: [keeper]
    environment: *chenv
    ports: ["8124:8123", "9001:9000"]
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ch2_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on: [ch1, ch2]
    ports: ["3000:3000"]
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana

volumes:
  ch1_data:
  ch2_data:
  grafana_data: